name: Acesso anônimo às rotas clínicas

# Probe ao vivo (scripts/security/check-anonymous-access.js): toda rota que
# devolve dado clínico tem de responder 401/403 a quem não está logado.
on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        api:
          - https://api.espacopreludio.com.br
          - https://api-staging.espacopreludio.com.br
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Rotas clínicas negam chamador anônimo
        run: node scripts/security/check-anonymous-access.js "$API"
        env:
          API: ${{ matrix.api }}
