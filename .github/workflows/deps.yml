name: Dependency Audit

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: '0 9 * * 1'  # Segunda-feira 9h — scan semanal

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: npm audit (high + critical)
        run: npm audit --audit-level=high --json | tee audit-report.json; npm audit --audit-level=high
        continue-on-error: true
        id: audit

      - name: Upload relatório de auditoria
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30

      - name: Falhar build se há vulnerabilidades high/critical
        if: steps.audit.outcome == 'failure'
        run: |
          echo "npm audit encontrou vulnerabilidades high ou critical."
          echo "Rode 'npm audit' localmente e aplique 'npm audit fix' ou atualize o pacote manualmente."
          exit 1

  validate-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar secrets obrigatórios no Railway
        run: node scripts/validate-env.js --ci
        env:
          CI_MODE: "true"
