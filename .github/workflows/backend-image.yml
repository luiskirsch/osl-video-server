name: Imagem do backend

# Monta a imagem do backend a cada push, fora do builder do Railway. Se o
# Railway não conseguir construir (incidente de 2026-10-21/22), `npm run
# publicar` no PC entrega esta imagem pronta ao Railway.
on:
  push:
    branches: [luiskirsch.github.io]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Montar e publicar no GitHub Container Registry
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker build \
            --build-arg GIT_COMMIT_SHA="$GITHUB_SHA" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker logout ghcr.io
