name: Clinical access controls
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: security/firebase/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --prefix security/firebase
      - run: npm audit --prefix security/firebase --audit-level=high
      - run: npm install --global --ignore-scripts firebase-tools@15.25.1
      - name: Verify clinical denial in isolated emulators
        working-directory: security/firebase
        run: npm run test:emulators
