name: Lembrete de Rotação de Secrets

permissions:
  contents: read

concurrency:
  group: secret-rotation-reminder
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 10 1 * *'  # 1º de cada mês às 10h
  workflow_dispatch:

jobs:
  criar-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Abrir issue de rotação
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const hoje = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Security] Rotação mensal de secrets — ${hoje}`,
              labels: ['security'],
              body: `## Checklist de rotação de secrets

            Rodar este checklist todo mês para mitigar janela de exposição.

            ### Railway (prod + staging)
            - [ ] \`ACCESS_TOKEN_SECRET\` — novo valor: \`openssl rand -hex 32\`
            - [ ] \`LICENSE_SECRET\` — novo valor: \`openssl rand -hex 32\`
            - [ ] \`ADMIN_SECRET\` — novo valor: \`openssl rand -base64 32\`
            - [ ] \`EMPRESA_JWT_SECRET\` — novo valor: \`openssl rand -hex 32\`
            - [ ] \`VAPID_PUBLIC_KEY\` + \`VAPID_PRIVATE_KEY\` — \`npx web-push generate-vapid-keys\`

            ### Mercado Pago
            - [ ] \`MP_WEBHOOK_SECRET_JOGO\` — regenerar no painel MP → Suas integrações → Notificações
            - [ ] \`MP_WEBHOOK_SECRET_THERAPY\` (se existir) — mesma fonte

            ### Pós-rotação
            - [ ] Testar \`/health\` em prod e staging
            - [ ] Testar login do painel admin
            - [ ] Testar webhook MP com um pagamento de teste

            ---
            *Issue criada automaticamente pelo workflow \`secret-rotation-reminder.yml\`.*`
            });
