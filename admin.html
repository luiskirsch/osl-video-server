<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>OSL CONTROL CORE</title>

<style>
body{
  margin:0;
  background:#020202;
  color:#00ff9c;
  font-family:monospace;
}

.grid{
  display:grid;
  grid-template-columns: 250px 1fr 350px;
  height:100vh;
}

/* MENU */
.menu{
  border-right:1px solid #00ff9c;
  padding:15px;
}

.menu h3{
  margin-bottom:20px;
}

.menu button{
  display:block;
  width:100%;
  margin-bottom:10px;
  background:none;
  border:1px solid #00ff9c;
  color:#00ff9c;
  padding:8px;
  cursor:pointer;
}

/* MAIN */
.main{
  padding:15px;
  overflow:auto;
}

.section{
  display:none;
}

.active{
  display:block;
}

.card{
  border:1px solid #00ff9c;
  padding:10px;
  margin-bottom:10px;
}

/* LOG */
.logs{
  border-left:1px solid #00ff9c;
  padding:10px;
  overflow:auto;
}

.log{
  font-size:12px;
}
</style>
</head>

<body>

<div class="grid">

  <!-- MENU -->
  <div class="menu">
    <h3>OSL CORE</h3>

    <button onclick="show('rooms')">Salas</button>
    <button onclick="show('chat')">Chat</button>
    <button onclick="show('video')">Vídeo</button>
    <button onclick="show('payments')">Pagamentos</button>
    <button onclick="show('system')">Sistema</button>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div id="rooms" class="section active"></div>
    <div id="chat" class="section"></div>
    <div id="video" class="section"></div>
    <div id="payments" class="section"></div>
    <div id="system" class="section"></div>

  </div>

  <!-- LOG -->
  <div class="logs">
    <h3>SYSTEM LOG</h3>
    <div id="logs"></div>
  </div>

</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
const SERVER = "https://osl-video-server-production.up.railway.app";

const socket = io(SERVER);

const logsEl = document.getElementById("logs");

// troca de abas
function show(id){
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// LOG
function log(msg){
  const div = document.createElement("div");
  div.className = "log";
  div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logsEl.appendChild(div);
}

// ROOMS
socket.on("rooms-update", (rooms)=>{
  document.getElementById("rooms").innerHTML = rooms.map(r=>`
    <div class="card">
      <b>${r.name}</b><br>
      players: ${r.playerCount}<br>
      video: ${r.videoActive}<br>
      recording: ${r.recordingActive}
    </div>
  `).join("");
});

// CHAT
socket.on("new-message", (msg)=>{
  const el = document.getElementById("chat");
  el.innerHTML += `<div class="card">${msg.roomId}: ${msg.message}</div>`;
  log("mensagem recebida");
});

// VIDEO STATUS
socket.on("rooms-update", (rooms)=>{
  document.getElementById("video").innerHTML = rooms.map(r=>`
    <div class="card">
      ${r.name} → vídeo: ${r.videoActive ? "ON" : "OFF"}
    </div>
  `).join("");
});

// SYSTEM
async function loadSystem(){
  const res = await fetch(SERVER + "/health");
  const data = await res.json();

  document.getElementById("system").innerHTML = `
    <div class="card">
      STATUS: ${data.ok}<br>
      UPTIME: ${Math.floor(data.uptimeSec)}s<br>
      ENV: ${data.environment}
    </div>
  `;
}

loadSystem();

socket.on("connect", ()=> log("socket conectado"));
</script>

</body>
</html>
