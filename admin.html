<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>OSL // CONTROL CORE</title>

<style>
body{
  margin:0;
  background:#010101;
  color:#00ff9c;
  font-family:monospace;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns: 260px 1fr 360px;
  height:100vh;
}

/* MENU */
.menu{
  border-right:1px solid #00ff9c33;
  padding:20px;
}

.menu h2{
  margin-bottom:20px;
  font-size:18px;
}

.menu button{
  width:100%;
  margin-bottom:10px;
  padding:10px;
  background:none;
  border:1px solid #00ff9c55;
  color:#00ff9c;
  cursor:pointer;
}

.menu button:hover{
  background:#00ff9c11;
}

/* MAIN */
.main{
  padding:20px;
  overflow:auto;
}

.section{
  display:none;
}

.active{
  display:block;
}

/* CARDS */
.card{
  border:1px solid #00ff9c33;
  padding:15px;
  margin-bottom:12px;
}

.title{
  font-size:18px;
  margin-bottom:10px;
}

/* STATUS */
.status{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:10px;
}

.box{
  border:1px solid #00ff9c22;
  padding:10px;
  text-align:center;
}

/* LOG */
.logs{
  border-left:1px solid #00ff9c33;
  padding:15px;
  overflow:auto;
}

.log{
  font-size:12px;
  margin-bottom:5px;
}
</style>
</head>

<body>

<div class="grid">

<!-- MENU -->
<div class="menu">
  <h2>OSL CORE</h2>

  <button onclick="show('dashboard')">Dashboard</button>
  <button onclick="show('rooms')">Salas</button>
  <button onclick="show('chat')">Chat</button>
  <button onclick="show('video')">Vídeo</button>
  <button onclick="show('payments')">Pagamentos</button>
  <button onclick="show('system')">Sistema</button>
</div>

<!-- MAIN -->
<div class="main">

<!-- DASHBOARD -->
<div id="dashboard" class="section active">
  <div class="title">Visão Geral</div>

  <div class="status">
    <div class="box">Salas<br><b id="statRooms">0</b></div>
    <div class="box">Jogadores<br><b id="statPlayers">0</b></div>
    <div class="box">Mensagens<br><b id="statMessages">0</b></div>
    <div class="box">Vídeo ON<br><b id="statVideo">0</b></div>
    <div class="box">Gravação<br><b id="statRecord">0</b></div>
    <div class="box">Pagamentos<br><b id="statPayments">0</b></div>
  </div>
</div>

<!-- ROOMS -->
<div id="rooms" class="section">
  <div class="title">Salas</div>
  <div id="roomsList">0 salas</div>
</div>

<!-- CHAT -->
<div id="chat" class="section">
  <div class="title">Chat</div>
  <div id="chatList">Nenhuma mensagem</div>
</div>

<!-- VIDEO -->
<div id="video" class="section">
  <div class="title">Vídeo</div>
  <div id="videoList">Nenhuma atividade</div>
</div>

<!-- PAYMENTS -->
<div id="payments" class="section">
  <div class="title">Pagamentos</div>
  <div id="paymentsList">0 transações</div>
</div>

<!-- SYSTEM -->
<div id="system" class="section">
  <div class="title">Sistema</div>
  <div id="systemInfo">Carregando...</div>
</div>

</div>

<!-- LOG -->
<div class="logs">
  <div class="title">SYSTEM LOG</div>
  <div id="logs"></div>
</div>

</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
const SERVER = "https://osl-video-server-production.up.railway.app";

const socket = io(SERVER);

let stats = {
  rooms:0,
  players:0,
  messages:0,
  video:0,
  record:0,
  payments:0
};

function updateStats(){
  document.getElementById("statRooms").textContent = stats.rooms;
  document.getElementById("statPlayers").textContent = stats.players;
  document.getElementById("statMessages").textContent = stats.messages;
  document.getElementById("statVideo").textContent = stats.video;
  document.getElementById("statRecord").textContent = stats.record;
  document.getElementById("statPayments").textContent = stats.payments;
}

function show(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function log(text){
  const div = document.createElement("div");
  div.className = "log";
  div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
  document.getElementById("logs").appendChild(div);
}

/* ROOMS */
socket.on("rooms-update", rooms=>{
  stats.rooms = rooms.length;
  stats.players = rooms.reduce((a,r)=>a+r.playerCount,0);
  stats.video = rooms.filter(r=>r.videoActive).length;
  stats.record = rooms.filter(r=>r.recordingActive).length;

  updateStats();

  if(!rooms.length){
    document.getElementById("roomsList").innerHTML = "0 salas ativas";
    return;
  }

  document.getElementById("roomsList").innerHTML = rooms.map(r=>`
    <div class="card">
      ${r.name}<br>
      players: ${r.playerCount}<br>
      video: ${r.videoActive}<br>
      recording: ${r.recordingActive}
    </div>
  `).join("");
});

/* CHAT */
socket.on("new-message", msg=>{
  stats.messages++;
  updateStats();

  document.getElementById("chatList").innerHTML += `
    <div class="card">${msg.roomId}: ${msg.message}</div>
  `;

  log("mensagem recebida");
});

/* SYSTEM */
async function loadSystem(){
  const res = await fetch(SERVER + "/health");
  const d = await res.json();

  document.getElementById("systemInfo").innerHTML = `
    STATUS: ${d.ok}<br>
    UPTIME: ${Math.floor(d.uptimeSec)}s<br>
    ENV: ${d.environment}
  `;
}

loadSystem();

socket.on("connect", ()=> log("socket conectado"));
</script>

</body>
</html>
