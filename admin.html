<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>OSL // SYSTEM CORE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:monospace;
  color:#00ff9c;

  background:
    radial-gradient(circle at 20% 20%, #00332233, transparent 40%),
    radial-gradient(circle at 80% 0%, #00221155, transparent 50%),
    radial-gradient(circle at 50% 100%, #001a0f, #000);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns: 260px 1fr 360px;
  height:100vh;
}

/* MENU */
.menu{
  border-right:1px solid #00ff9c22;
  padding:20px;
}

.menu h2{ margin-bottom:20px; }

.menu button{
  width:100%;
  margin-bottom:10px;
  padding:10px;
  background:none;
  border:1px solid #00ff9c33;
  color:#00ff9c;
  cursor:pointer;
}

.menu button:hover{
  background:#00ff9c11;
}

/* MAIN */
.main{
  padding:20px;
  overflow:auto;
}

.section{ display:none; }
.active{ display:block; }

/* CARDS */
.card{
  border:1px solid #00ff9c22;
  padding:12px;
  margin-bottom:10px;
}

/* STATUS */
.status{
  display:grid;
  grid-template-columns: repeat(3,1fr);
  gap:10px;
}

.box{
  border:1px solid #00ff9c22;
  padding:10px;
  text-align:center;
}

/* LOG */
.logs{
  border-left:1px solid #00ff9c22;
  padding:15px;
  overflow:auto;
}

.log{
  font-size:12px;
  margin-bottom:4px;
}

/* TERMINAL */
.terminal{
  margin-top:10px;
  border:1px solid #00ff9c22;
  padding:10px;
}
</style>
</head>

<body>

<div class="grid">

<!-- MENU -->
<div class="menu">
  <h2>OSL CORE</h2>

  <button onclick="show('dashboard')">Dashboard</button>
  <button onclick="show('rooms')">Salas</button>
  <button onclick="show('chat')">Chat</button>
  <button onclick="show('video')">Vídeo</button>
  <button onclick="show('system')">Sistema</button>
</div>

<!-- MAIN -->
<div class="main">

<!-- DASHBOARD -->
<div id="dashboard" class="section active">
  <div class="status">
    <div class="box">Salas<br><b id="statRooms">0</b></div>
    <div class="box">Jogadores<br><b id="statPlayers">0</b></div>
    <div class="box">Mensagens<br><b id="statMessages">0</b></div>
    <div class="box">Vídeo<br><b id="statVideo">0</b></div>
    <div class="box">Gravação<br><b id="statRecord">0</b></div>
    <div class="box">Eventos<br><b id="statEvents">0</b></div>
  </div>
</div>

<!-- ROOMS -->
<div id="rooms" class="section">
  <div id="roomsList">0 salas</div>
</div>

<!-- CHAT -->
<div id="chat" class="section">
  <div id="chatList">nenhuma mensagem</div>
</div>

<!-- VIDEO -->
<div id="video" class="section">
  <div id="videoList">sem atividade</div>
</div>

<!-- SYSTEM -->
<div id="system" class="section">
  <div id="systemInfo">carregando...</div>

  <div class="terminal" id="terminal">
    terminal iniciado...
  </div>
</div>

</div>

<!-- LOG -->
<div class="logs">
  <div>SYSTEM LOG</div>
  <div id="logs"></div>
</div>

</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
const SERVER = "https://osl-video-server-production.up.railway.app";
const socket = io(SERVER);

let stats = {
  rooms:0,
  players:0,
  messages:0,
  video:0,
  record:0,
  events:0
};

function show(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function log(msg){
  const el = document.getElementById("logs");
  const div = document.createElement("div");
  div.className = "log";
  div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;

  while(el.children.length > 150){
    el.removeChild(el.firstChild);
  }
}

function updateStats(){
  statRooms.textContent = stats.rooms;
  statPlayers.textContent = stats.players;
  statMessages.textContent = stats.messages;
  statVideo.textContent = stats.video;
  statRecord.textContent = stats.record;
  statEvents.textContent = stats.events;
}

/* SOCKET */
socket.on("connect", ()=> log("🟢 conectado"));

socket.on("rooms-update", rooms=>{
  stats.rooms = rooms.length;
  stats.players = rooms.reduce((a,r)=>a+r.playerCount,0);
  stats.video = rooms.filter(r=>r.videoActive).length;
  stats.record = rooms.filter(r=>r.recordingActive).length;
  stats.events++;

  updateStats();

  if(!rooms.length){
    roomsList.innerHTML = "0 salas ativas";
  }else{
    roomsList.innerHTML = rooms.map(r=>`
      <div class="card">
        ${r.name}<br>
        players: ${r.playerCount}<br>
        video: ${r.videoActive}<br>
        recording: ${r.recordingActive}
      </div>
    `).join("");
  }

  videoList.innerHTML = rooms.map(r=>`
    <div class="card">${r.name}: ${r.videoActive ? "ON" : "OFF"}</div>
  `).join("");

  log("atualização de salas");
});

socket.on("new-message", msg=>{
  stats.messages++;
  stats.events++;
  updateStats();

  chatList.innerHTML += `<div class="card">${msg.roomId}: ${msg.message}</div>`;
  log("mensagem recebida");
});

/* SYSTEM */
async function loadSystem(){
  try{
    const res = await fetch(SERVER + "/health");
    const d = await res.json();

    systemInfo.innerHTML = `
      status: ${d.ok}<br>
      uptime: ${Math.floor(d.uptimeSec)}s<br>
      env: ${d.environment}
    `;

    log("health carregado");
  }catch{
    log("erro ao carregar health");
  }
}

loadSystem();

/* HEARTBEAT (VIDA) */
setInterval(()=>{
  log("monitorando sistema...");
},4000);

setInterval(()=>{
  log("checando conexões...");
},7000);

setInterval(()=>{
  if(stats.rooms === 0){
    log("nenhuma atividade detectada");
  }
},9000);

/* TERMINAL SIMULADO */
setInterval(()=>{
  const t = document.getElementById("terminal");
  t.innerHTML += `<div>> sync ok</div>`;
  t.scrollTop = t.scrollHeight;
},3000);

</script>

</body>
</html>
