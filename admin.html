<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSL CONTROL</title>

<style>
body{
  margin:0;
  background:#000;
  color:#00ff9c;
  font-family:monospace;
}

.container{
  display:grid;
  grid-template-columns: 1fr 350px;
  height:100vh;
}

.left{
  padding:20px;
}

.right{
  border-left:1px solid #00ff9c;
  padding:20px;
  overflow:auto;
}

.title{
  font-size:20px;
  margin-bottom:20px;
}

.room{
  border:1px solid #00ff9c;
  padding:10px;
  margin-bottom:10px;
}

.player{
  margin-left:10px;
  font-size:12px;
}

.log{
  font-size:12px;
  margin-bottom:5px;
}
</style>
</head>

<body>

<div class="container">

  <div class="left">
    <div class="title">OSL SERVER // LIVE</div>

    <div id="rooms"></div>
  </div>

  <div class="right">
    <div class="title">SYSTEM LOG</div>
    <div id="logs"></div>
  </div>

</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
const SERVER = "https://osl-video-server-production.up.railway.app";

const roomsEl = document.getElementById("rooms");
const logsEl = document.getElementById("logs");

// 🔌 SOCKET REALTIME
const socket = io(SERVER);

socket.on("connect", () => {
  log("🟢 conectado ao servidor");
});

// 📡 ROOMS UPDATE
socket.on("rooms-update", (rooms) => {
  renderRooms(rooms);
});

// 💬 MENSAGENS
socket.on("new-message", (msg) => {
  log(`💬 ${msg.roomId}: ${msg.message}`);
});

// 🔄 FALLBACK (caso socket falhe)
async function fetchRooms(){
  const res = await fetch(SERVER + "/game/rooms");
  const data = await res.json();
  renderRooms(data.rooms || []);
}

// 🎯 RENDER SALAS
function renderRooms(rooms){
  if(!rooms.length){
    roomsEl.innerHTML = "Nenhuma sala ativa";
    return;
  }

  roomsEl.innerHTML = rooms.map(room => `
    <div class="room">
      <b>${room.name}</b><br>
      ID: ${room.roomId}<br>
      Players: ${room.playerCount}<br>
      Video: ${room.videoActive ? "ON" : "OFF"}<br>
      Recording: ${room.recordingActive ? "ON" : "OFF"}<br>

      ${room.players.map(p => `
        <div class="player">- ${p.playerName}</div>
      `).join("")}
    </div>
  `).join("");
}

// 🧾 LOG
function log(text){
  const div = document.createElement("div");
  div.className = "log";
  div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
  logsEl.appendChild(div);
  logsEl.scrollTop = logsEl.scrollHeight;
}

// fallback inicial
fetchRooms();
setInterval(fetchRooms, 5000);
</script>

</body>
</html>
