<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>OSL // SYSTEM CORE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:monospace;
  color:#00ff9c;

  background:
    radial-gradient(circle at 20% 20%, #00332233, transparent 40%),
    radial-gradient(circle at 80% 0%, #00221155, transparent 50%),
    radial-gradient(circle at 50% 100%, #001a0f, #000);
}

.grid{
  display:grid;
  grid-template-columns: 260px 1fr 360px;
  height:100vh;
}

.menu{
  border-right:1px solid #00ff9c22;
  padding:20px;
}

.menu h2{ margin-bottom:20px; }

.menu button{
  width:100%;
  margin-bottom:10px;
  padding:10px;
  background:none;
  border:1px solid #00ff9c33;
  color:#00ff9c;
  cursor:pointer;
}

.menu button:hover{
  background:#00ff9c11;
}

.main{
  padding:20px;
  overflow:auto;
}

.section{ display:none; }
.active{ display:block; }

.card{
  border:1px solid #00ff9c22;
  padding:12px;
  margin-bottom:10px;
}

.status{
  display:grid;
  grid-template-columns: repeat(3,1fr);
  gap:10px;
}

.box{
  border:1px solid #00ff9c22;
  padding:10px;
  text-align:center;
}

.logs{
  border-left:1px solid #00ff9c22;
  padding:15px;
  overflow:auto;
}

.log{
  font-size:12px;
  margin-bottom:4px;
}

.terminal{
  margin-top:10px;
  border:1px solid #00ff9c22;
  padding:10px;
}
</style>
</head>

<body>

<div class="grid">

<div class="menu">
  <h2>OSL CORE</h2>
  <button onclick="show('dashboard')">Dashboard</button>
  <button onclick="show('rooms')">Salas</button>
  <button onclick="show('video')">Vídeo</button>
  <button onclick="show('system')">Sistema</button>
</div>

<div class="main">

<div id="dashboard" class="section active">
  <div class="status">
    <div class="box">Salas<br><b id="statRooms">0</b></div>
    <div class="box">Jogadores<br><b id="statPlayers">0</b></div>
    <div class="box">Eventos<br><b id="statEvents">0</b></div>
    <div class="box">Vídeo<br><b id="statVideo">0</b></div>
    <div class="box">Gravação<br><b id="statRecord">0</b></div>
  </div>
</div>

<div id="rooms" class="section">
  <div id="roomsList">Carregando...</div>
</div>

<div id="video" class="section">
  <div id="videoList">Sem atividade</div>
</div>

<div id="system" class="section">
  <div id="systemInfo">Carregando...</div>
  <div class="terminal" id="terminal">terminal iniciado...</div>
</div>

</div>

<div class="logs">
  <div>SYSTEM LOG</div>
  <div id="logs"></div>
</div>

</div>

<script>
const SERVER = "https://osl-video-server-production.up.railway.app";

let stats = {
  rooms:0,
  players:0,
  video:0,
  record:0,
  events:0
};

function show(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function log(msg){
  const el = document.getElementById("logs");
  const div = document.createElement("div");
  div.className = "log";
  div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function updateStats(){
  statRooms.textContent = stats.rooms;
  statPlayers.textContent = stats.players;
  statVideo.textContent = stats.video;
  statRecord.textContent = stats.record;
  statEvents.textContent = stats.events;
}

/* ===== SALAS ===== */
async function loadRooms(){
  try{
    const res = await fetch(SERVER + "/game/rooms", { cache:"no-store" });
    const data = await res.json();

    const rooms = data.rooms || [];

    stats.rooms = rooms.length;
    stats.players = rooms.reduce((a,r)=>a+(r.playerCount||0),0);
    stats.video = rooms.filter(r=>r.videoActive).length;
    stats.record = rooms.filter(r=>r.recordingActive).length;
    stats.events++;

    updateStats();

    if(!rooms.length){
      roomsList.innerHTML = "Nenhuma sala ativa";
      videoList.innerHTML = "Sem atividade";
      return;
    }

    roomsList.innerHTML = rooms.map(r=>`
      <div class="card">
        <b>${r.name || r.roomId}</b><br>
        Código: ${r.roomId}<br>
        Host: ${r.host || "-"}<br>
        Jogadores: ${r.playerCount}<br>
        Sessão: ${r.sessionActive ? "ATIVA" : "PARADA"}<br>
        Vídeo: ${r.videoActive ? "ON" : "OFF"}<br>
        Gravação: ${r.recordingActive ? "ON" : "OFF"}
      </div>
    `).join("");

    videoList.innerHTML = rooms.map(r=>`
      <div class="card">
        ${r.name}: vídeo ${r.videoActive ? "ON" : "OFF"}
      </div>
    `).join("");

    log("salas atualizadas");

  }catch(e){
    log("erro ao carregar salas");
    console.error(e);
  }
}

/* ===== SYSTEM ===== */
async function loadSystem(){
  try{
    const res = await fetch(SERVER + "/health");
    const d = await res.json();

    systemInfo.innerHTML = `
      status: ${d.ok}<br>
      uptime: ${Math.floor(d.uptimeSec)}s<br>
      env: ${d.environment}
    `;

    log("health carregado");
  }catch{
    log("erro no health");
  }
}

/* ===== LOOP ===== */
loadRooms();
loadSystem();

setInterval(loadRooms, 2000);
setInterval(loadSystem, 5000);

/* TERMINAL VISUAL */
setInterval(()=>{
  terminal.innerHTML += `<div>> sync ok</div>`;
  terminal.scrollTop = terminal.scrollHeight;
},3000);

</script>

</body>
</html>
